databases:
  - name: tax-tracker-db
    plan: free

services:
  - type: web
    name: tax-tracker-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && playwright install chromium"
    startCommand: "uvicorn backend.app.api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tax-tracker-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://tax-tracker-frontend.onrender.com
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ALERT_TO_EMAIL
        sync: false

  - type: web
    name: tax-tracker-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://tax-tracker-backend-v8f1.onrender.com
