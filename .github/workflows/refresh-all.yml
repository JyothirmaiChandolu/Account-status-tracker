name: Scheduled Refresh All

on:
  schedule:
    - cron: "0 8 * * *"   # daily, 8am UTC — adjust as needed
  workflow_dispatch: {}    # lets you trigger a test run manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger refresh-all
        run: |
          curl -X POST "${{ secrets.BACKEND_URL }}/api/companies/refresh-all" \
            --max-time 180 --retry 3 --retry-delay 30 --fail
